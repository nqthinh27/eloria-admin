# Nginx TRONG container: chỉ phục vụ file tĩnh của bản build, nghe HTTP cổng 80.
#
# TLS (certbot), redirect 80→443, header bảo mật và proxy `/v1.0` → backend do nginx Ở HOST lo
# (/etc/nginx/conf.d/eloria.conf), nên KHÔNG lặp lại ở đây. Host chuyển tiếp `/` vào container này
# (127.0.0.1:8081) và `/v1.0/` thẳng vào backend — cùng origin, cookie refresh_token mới sống.
#
# Phần dưới là thứ nginx host KHÔNG làm thay được, thiếu là hỏng app:
#   1. SPA fallback            — BrowserRouter, thiếu thì F5 ở route sâu ra 404.
#   2. /index.html, /config.js, /version.json không cache — config.js sinh lại mỗi lần container
#      khởi động; version.json để app phát hiện bản mới.
server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/woff font/woff2;

    # Asset có hash trong tên ⇒ cache vĩnh viễn.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /version.json {
        add_header Cache-Control "no-store, must-revalidate";
        default_type application/json;
    }

    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
