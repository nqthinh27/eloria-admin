# Cấu hình nginx MẶC ĐỊNH, nướng vào image để nó chạy được ngay sau khi build.
#
# Đây là bản tối thiểu, không phải nơi cấu hình cho từng môi trường: khi có conf riêng thì
# bind-mount đè lên /etc/nginx/conf.d/default.conf (xem docker-compose.yml, khối `volumes`).
#
# ⚠️ ĐỔI `quantri.eloria.com.vn` thành domain thật ở CẢ 4 chỗ bên dưới trước khi chạy (đã điền domain thật của môi trường production hiện tại).
#
# ⚠️ Conf tự viết BẮT BUỘC giữ 3 điểm dưới đây, thiếu là hỏng app:
#   1. `try_files $uri $uri/ /index.html`  — BrowserRouter, thiếu thì F5 ở route sâu ra 404.
#   2. `/config.js` KHÔNG được cache       — file này sinh lại mỗi lần container khởi động.
#   3. proxy `/v1.0` cùng origin           — cookie refresh_token là HttpOnly, không
#      Secure/SameSite nên chỉ sống khi FE và BE chung origin.

# ─────────────────────────────────────────────────────────────────────────────
# Cổng 80 — KHÔNG phục vụ app, chỉ 2 việc:
#   • giữ đường cho ACME challenge của certbot (bịt là không gia hạn cert được)
#   • đá mọi thứ còn lại sang HTTPS
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen      80;
    server_name quantri.eloria.com.vn;

    # certbot ghi file thử thách vào đây (volume ./certbot/www).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Cổng 443 — app thật
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen              443 ssl;
    http2               on;
    server_name         quantri.eloria.com.vn;

    # Cert do certbot cấp, mount qua volume ./certbot/conf → /etc/letsencrypt.
    # ⚠️ Thiếu 2 file này thì nginx KHÔNG khởi động được ⇒ phải cấp cert TRƯỚC khi `up -d`
    # (xem hướng dẫn certbot trong docker-compose.yml).
    ssl_certificate     /etc/letsencrypt/live/quantri.eloria.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantri.eloria.com.vn/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    root  /usr/share/nginx/html;
    index index.html;

    # Upload ảnh sản phẩm — nới nếu cần.
    client_max_body_size 20m;

    # Web quản trị nội bộ — không cho search engine lập chỉ mục.
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Ép trình duyệt chỉ dùng HTTPS. Chỉ bật khi cert đã chạy ổn: trình duyệt nhớ header này
    # rất lâu, bật sớm mà TLS hỏng là không vào được site bằng HTTP để sửa.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/woff font/woff2;

    # ── API ──────────────────────────────────────────────────────────────────
    # Cookie `refresh_token` của backend là HttpOnly, path=/v1.0/api/refresh,
    # KHÔNG Secure/SameSite ⇒ chỉ sống khi FE và BE cùng origin. Nginx đứng ra
    # làm same-origin đúng như `server.proxy` của Vite lúc dev.
    location /v1.0/ {
        # Đổi theo hạ tầng thật rồi mount đè file này.
        proxy_pass         http://eloria-backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Không đụng vào Set-Cookie: giữ nguyên path/flag backend đặt.
        proxy_cookie_path  off;
        proxy_cookie_domain off;

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Xuất Excel / in hoá đơn có thể trả file lớn.
        proxy_buffering off;
    }

    # ── Asset có hash trong tên ⇒ cache vĩnh viễn ────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html không được cache, nếu không user kẹt ở bản cũ sau deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # config.js được sinh lại mỗi lần container khởi động (giá trị lấy từ docker-compose.yml)
    # ⇒ cache là đổi biến xong trình duyệt vẫn ăn cấu hình cũ.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        default_type application/javascript;
    }

    # ── SPA fallback (BrowserRouter) ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
